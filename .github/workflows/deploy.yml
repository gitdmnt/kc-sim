# Production deploy on every push to main (docs/DEPLOY.md "Automatic deploy"): tests, the static map bundle from
# production D1, the web build, then pending D1 migrations, then `wrangler deploy --env production` (upload only).
# Everything that can fail runs before the migration.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of cancelling it mid-deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim-core
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: |
          (cd web && bun install --frozen-lockfile)
          (cd server && bun install --frozen-lockfile)
          (cd poi-plugin-sim && bun install)

      - name: Build sim-core
        working-directory: server
        run: bun run build:wasm

      - name: Test
        run: |
          (cd poi-plugin-sim && bun test && bunx tsc --noEmit)
          (cd web && bun test)
          (cd server && bun run typecheck && bun test)

      - name: Export map bundle from production D1
        working-directory: server
        run: D1_REMOTE=1 bun run export:bundle

      - name: Build web
        working-directory: server
        run: bun run build:web

      - name: Apply D1 migrations
        working-directory: server
        run: bun run migrate:remote

      - name: Deploy
        working-directory: server
        run: bunx wrangler deploy --env production
