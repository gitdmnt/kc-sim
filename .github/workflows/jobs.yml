# Production background jobs (docs/DEPLOY.md §5 "Jobs"). They used to run in the worker's hourly cron; they now run
# here, as bun scripts against production D1 over the D1 HTTP API (server/scripts/lib/d1-database.ts, D1_REMOTE=1).
#   hourly: staged uploads → observations, aggregation, estimator (scripts/run-jobs.ts run), then the KCNav queue
#           (scripts/run-jobs.ts kcnav: one request per ≥ 65 s gate, persisted in D1, until the queue is empty or
#           its time is up)
#   daily:  routing inferred from poi sortie observations for maps without hand-authored rules, and the check of
#           observations against the hand-authored rules (scripts/infer-routing.ts --write)
# GitHub runs schedules on a best-effort basis (often minutes late, occasionally skipped); every queue is persistent,
# so a late or skipped run only delays the work.
name: jobs

on:
  schedule:
    - cron: "7 * * * *"
    - cron: "37 18 * * *" # 03:37 JST
  workflow_dispatch:
    inputs:
      task:
        description: what to run
        type: choice
        options: [jobs, routing, both]
        default: jobs

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  D1_REMOTE: "1"

jobs:
  jobs:
    if: (github.event_name == 'schedule' && github.event.schedule == '7 * * * *') || (github.event_name == 'workflow_dispatch' && inputs.task != 'routing')
    runs-on: ubuntu-latest
    # Private repo: Actions minutes are billed per job, rounded up (DEPLOY.md §5 "Cost"). An idle run takes ~1 min;
    # the time caps below bound a busy one to ~22 min.
    timeout-minutes: 30
    # One jobs run at a time (the D1 jobs lease would also refuse a second one); a newer run waits.
    concurrency:
      group: jobs-production-jobs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # The estimator needs sim-core's wasm (hitProbabilityGrid); rebuilt only when sim-core changes.
      - id: wasm
        uses: actions/cache@v4
        with:
          path: sim-core/pkg
          key: sim-core-pkg-${{ hashFiles('sim-core/src/**', 'sim-core/Cargo.toml', 'sim-core/Cargo.lock') }}
      - if: steps.wasm.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - if: steps.wasm.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - if: steps.wasm.outputs.cache-hit != 'true'
        working-directory: server
        run: bun run build:wasm

      - name: Install
        working-directory: server
        run: bun install --frozen-lockfile

      - name: Jobs (ingest, aggregation, estimator)
        working-directory: server
        run: bun scripts/run-jobs.ts run --minutes 10

      - name: KCNav queue
        working-directory: server
        run: bun scripts/run-jobs.ts kcnav --minutes 10

  routing:
    if: (github.event_name == 'schedule' && github.event.schedule == '37 18 * * *') || (github.event_name == 'workflow_dispatch' && inputs.task != 'jobs')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: jobs-production-routing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # web/ brings the npm api_start2 snapshot (@kancolle/data) the inference uses for ship families (countIds).
      - name: Install
        run: |
          (cd web && bun install --frozen-lockfile)
          (cd server && bun install --frozen-lockfile)

      - name: Routing from observations
        working-directory: server
        run: bun scripts/infer-routing.ts --write
