# KCNav battle crawl (private deployment notes §5 "KCNav battle crawl"): works through the `battles` jobs of the KCNav queue
# (pages of real battles for the accuracy harness, server/scripts/battle-accuracy.ts) at the shared gate's rate:
# one request per ≥ 65 s (kv_state.kcnav_next_allowed_at in production D1, shared with the daily jobs workflow and any
# local runner), one 50-battle page per request. The daily jobs workflow skips `battles` jobs, so this is their only
# runner. A run stops when no `battles` job is pending (~1 min billed) or after its time budget.
# Cost (private repo, Actions minutes): a busy run bills ~1 + minutes (+1–2 when sim-core changed and the wasm is
# rebuilt); at the default 28 that is ≤ ~30 × 30 ≈ 900 min a month while a backlog lasts, ~30 a month once it is empty.
name: kcnav-crawl

on:
  schedule:
    - cron: "37 6 * * *" # 15:37 JST, away from the jobs workflow (03:07 JST)
  workflow_dispatch:
    inputs:
      minutes:
        description: time budget in minutes (one request per ≥ 65 s)
        type: number
        default: 28

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  D1_REMOTE: "1"

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: kcnav-crawl
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # run-jobs.ts loads sim-core's wasm (the estimator shares the script): the jobs workflow's cache, rebuilt only
      # when sim-core changes.
      - id: wasm
        uses: actions/cache@v4
        with:
          path: sim-core/pkg
          key: sim-core-pkg-${{ hashFiles('sim-core/src/**', 'sim-core/Cargo.toml', 'sim-core/Cargo.lock') }}
      - if: steps.wasm.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - if: steps.wasm.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - if: steps.wasm.outputs.cache-hit != 'true'
        working-directory: server
        run: bun run build:wasm
      - name: Install
        working-directory: server
        run: bun install --frozen-lockfile
      - name: KCNav battles
        working-directory: server
        run: bun scripts/run-jobs.ts kcnav --only battles --minutes ${{ inputs.minutes || 28 }}
