# KCNav battle crawl (docs/DEPLOY.md §5 "KCNav battle crawl"): works through the `battles` jobs of the KCNav queue
# (pages of real battles for the accuracy harness, sim-core/validation/battle-accuracy.ts) at the shared gate's rate:
# one request per ≥ 65 s (kv_state.kcnav_next_allowed_at in production D1, shared with the daily jobs workflow and any
# local runner), one 50-battle page per request. The daily jobs workflow skips `battles` jobs, so this is their only
# runner. A run stops when no `battles` job is pending (~1 min billed) or after its time budget.
# Cost (private repo, Actions minutes): a busy run bills ~1 + minutes; at the default 28 that is ≤ ~30 × 30 ≈ 900 min
# a month while a backlog lasts, 30 min a month once the queue is empty.
name: kcnav-crawl

on:
  schedule:
    - cron: "37 6 * * *" # 15:37 JST, away from the jobs workflow (03:07 JST)
  workflow_dispatch:
    inputs:
      minutes:
        description: time budget in minutes (one request per ≥ 65 s)
        type: number
        default: 28

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  D1_REMOTE: "1"

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: kcnav-crawl
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        working-directory: server
        run: bun install --frozen-lockfile
      - name: KCNav battles
        working-directory: server
        run: bun scripts/run-jobs.ts kcnav --only battles --minutes ${{ inputs.minutes || 28 }}
