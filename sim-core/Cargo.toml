[package]
name = "sim-core"
version = "0.2.0"
authors = ["gitdmnt <100859051+gitdmnt@users.noreply.github.com>"]
edition = "2021"
description = "KanColle single-node battle engine (Monte-Carlo) compiled to wasm"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2.129"
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
rand_core = "0.9"
rand_xoshiro = "0.7"
serde_json = "1.0.145"
# Logs Rust panics with `console.error` in the browser.
console_error_panic_hook = { version = "0.1.7", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
